name: Reconcile releases

# Weekly safety net for the release pipeline. `make release` publishes to
# npm and pushes a `v*` tag; ci.yml then creates the matching GitHub release
# (github-release) and publishes to JSR (publish-jsr). If either job is
# skipped (gate failure, API outage, runner death, etc.) the npm package
# ships without its counterpart — this workflow detects both kinds of drift
# and backfills. npm itself is published from `make release` directly, so it
# is never the side that goes missing.
#
# Cron only fires from the default branch. Use the workflow_dispatch input
# `dry_run` to verify behaviour without creating releases.

on:
  schedule:
    - cron: '0 4 * * 0' # Sundays 04:00 UTC (an hour after cleanup.yml)
  workflow_dispatch:
    inputs:
      dry_run:
        description: List missing tags without creating releases
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      missing: ${{ steps.scan.outputs.missing }}
      has_missing: ${{ steps.scan.outputs.has_missing }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need full tag history
      - id: scan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # `comm` requires LC_ALL=C lexicographic order — `sort -V` does NOT
          # produce that, so we pin LC_ALL=C and use plain `sort` for the diff.
          # Version order is only used at the end for human-friendly display.
          export LC_ALL=C
          tags=$(git tag -l 'v*' | sort)
          releases=$(gh release list --limit 500 --json tagName --jq '.[].tagName' | sort)
          missing=$(comm -23 <(echo "$tags") <(echo "$releases"))
          tag_count=$(echo "$tags" | grep -c . || true)
          release_count=$(echo "$releases" | grep -c . || true)

          {
            echo "## Release reconcile scan"
            echo ""
            echo "- tags: $tag_count"
            echo "- existing releases: $release_count"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$missing" ]; then
            echo "All tags have GitHub releases. ✅"
            echo "- missing: 0 ✅" >> "$GITHUB_STEP_SUMMARY"
            echo "has_missing=false" >> "$GITHUB_OUTPUT"
            echo "missing=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          missing_sorted=$(echo "$missing" | sort -V)
          missing_count=$(echo "$missing_sorted" | grep -c .)
          echo "Missing GitHub releases ($missing_count):"
          echo "$missing_sorted" | sed 's/^/  - /'
          {
            echo "- missing: $missing_count"
            echo ""
            echo "$missing_sorted" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

          json=$(echo "$missing_sorted" | jq -Rcs 'split("\n") | map(select(length>0))')
          echo "has_missing=true" >> "$GITHUB_OUTPUT"
          echo "missing=$json" >> "$GITHUB_OUTPUT"

  # ── JSR arm ───────────────────────────────────────────────────────────────────
  # Same drift, other registry. JSR is published by ci.yml from the tag rather than from
  # `make release`, precisely so the release carries provenance — which also means it can fail
  # independently of npm, leaving a version on npm but not JSR.
  detect-jsr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      missing: ${{ steps.scan.outputs.missing }}
      has_missing: ${{ steps.scan.outputs.has_missing }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need full tag history
      - id: scan
        shell: bash
        run: |
          set -euo pipefail
          published=$(curl -fsSL \
            "https://api.jsr.io/scopes/izelnakri/packages/qunitx-cli/versions?limit=100" \
            | jq -r '.items[].version' | sort -V)

          # Floor at the earliest version JSR actually holds. Most tags predate the JSR package
          # entirely (85 tags, 14 JSR versions, earliest 0.26.5); without this they would read as
          # missing forever and the publish arm would try to ship trees that have no jsr/ at all.
          floor=$(echo "$published" | head -1)

          missing=()
          for tag in $(git tag -l 'v*'); do
            version=${tag#v}
            # version >= floor iff sorting the pair puts floor first
            [ "$(printf '%s\n%s\n' "$version" "$floor" | sort -V | head -1)" = "$floor" ] || continue
            echo "$published" | grep -qx "$version" && continue
            missing+=("$tag")
          done

          {
            echo "## JSR reconcile scan"
            echo ""
            echo "- versions on JSR: $(echo "$published" | grep -c .)"
            echo "- floor (earliest published): $floor"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ${#missing[@]} -eq 0 ]; then
            echo "Every tag at or above $floor is on JSR. ✅"
            echo "- missing: 0 ✅" >> "$GITHUB_STEP_SUMMARY"
            echo "has_missing=false" >> "$GITHUB_OUTPUT"
            echo "missing=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\n' "${missing[@]}" | sed 's/^/  - /'
          {
            echo "- missing: ${#missing[@]}"
            echo ""
            printf '%s\n' "${missing[@]}" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

          json=$(printf '%s\n' "${missing[@]}" | jq -Rcs 'split("\n") | map(select(length>0))')
          echo "has_missing=true" >> "$GITHUB_OUTPUT"
          echo "missing=$json" >> "$GITHUB_OUTPUT"

  publish-jsr:
    # `always()` so a skipped GitHub-release arm (nothing missing there) does not block this one.
    # Ordered after it regardless, because jsr/cli.ts fetches its binary from the GitHub release —
    # publishing the launcher first would hand users a version whose binary does not exist yet.
    needs: [detect-jsr, publish]
    if: always() && needs.detect-jsr.outputs.has_missing == 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC — the backfill gets provenance too
    strategy:
      fail-fast: false
      max-parallel: 1 # one publish at a time; a version can never be replaced
      matrix:
        tag: ${{ fromJSON(needs.detect-jsr.outputs.missing) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.tag }} # publish that tag's tree, not main's
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      - run: node scripts/stage-jsr-library.ts
      - run: deno publish --allow-dirty
        working-directory: jsr

  publish:
    needs: detect
    if: needs.detect.outputs.has_missing == 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.detect.outputs.missing) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/publish-release
        with:
          tag: ${{ matrix.tag }}
          github_token: ${{ github.token }}
